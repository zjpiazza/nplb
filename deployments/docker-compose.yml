version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - REDIS_ADDR=redis:6379
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - QUEUE_NAME=${QUEUE_NAME:-nplb-queue}
    command: ["nplb-api"]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_FORMAT=${LOG_FORMAT:-console}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - REDIS_ADDR=redis:6379
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
      - QUEUE_NAME=${QUEUE_NAME:-nplb-queue}
      - GPG_HOME=/app/keys
      - GPG_KEY_EMAIL=${GPG_KEY_EMAIL}
      - OUTPUT_DIR=/app/build
      - DEFAULT_CODENAME=${DEFAULT_CODENAME:-stable}
    volumes:
      - gpg_keys:/app/keys
      - build_output:/app/build
    command: ["nplb-worker"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  gpg_keys:
  build_output:

networks:
  default:
    name: nplb_network
